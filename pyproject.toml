[project]
name = "rewind"
version = "0.1.0"
description = "Context compaction that archives what it drops and recalls it on demand"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
]

[project.scripts]
rewind-chat = "rewind.cli:main"
rewind-bench = "rewind.bench.cli:main"
rewind-serve = "rewind.server:main"
rewind-mcp = "rewind.mcp_server:main"

[project.optional-dependencies]
mcp = [
    "mcp>=2.2.0",
]
bedrock = [
    "anthropic[bedrock]>=1.6.0",
]
nim = [
    "openai>=3.15.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rewind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
